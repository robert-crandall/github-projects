[package]
name = "github-projects-workspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "github_projects_workspace"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled", "backup", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release.build-override]
# Stripping build-time dylibs can make procedural macros unloadable on macOS.
strip = "none"
