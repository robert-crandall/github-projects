name: Release Apple Silicon app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag and runner
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Expected an Apple Silicon runner, got $(uname -m)."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install service dependencies
        working-directory: service
        run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          app_version="$(bun -e 'console.log((await Bun.file("src-tauri/tauri.conf.json").json()).version)')"
          package_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          cargo_version="$(awk -F ' *= *' '/^version = / { gsub(/"/, "", $2); print $2; exit }' src-tauri/Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$GITHUB_REF_NAME" != "v${tag_version}" || "$tag_version" != "$app_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match the Tauri version v${app_version}."
            exit 1
          fi

          if [[ "$package_version" != "$app_version" || "$cargo_version" != "$app_version" ]]; then
            echo "package.json (${package_version}), Cargo.toml (${cargo_version}), and tauri.conf.json (${app_version}) must use the same version."
            exit 1
          fi

      - name: Build Tauri app bundle
        run: bun run tauri build --target aarch64-apple-darwin --bundles app

      - name: Package app bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          app_path="${bundle_dir}/GitHub Projects.app"
          zip_path="${bundle_dir}/GitHub-Projects-${GITHUB_REF_NAME}-macOS-arm64.zip"
          checksum_path="${zip_path}.sha256"

          if [[ ! -d "$app_path" ]]; then
            echo "Expected app bundle at $app_path"
            find "$bundle_dir" -maxdepth 2 -print || true
            exit 1
          fi

          ditto -c -k --rsrc --keepParent "$app_path" "$zip_path"
          (
            cd "$bundle_dir"
            shasum -a 256 "$(basename "$zip_path")" > "$(basename "$checksum_path")"
          )
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"
          ls -lh "$zip_path" "$checksum_path"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$ZIP_PATH" \
              "$CHECKSUM_PATH" \
              --verify-tag \
              --generate-notes \
              --title "GitHub Projects ${GITHUB_REF_NAME}"
          fi
